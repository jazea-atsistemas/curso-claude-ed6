openapi: 3.1.0
info:
  title: Resttek API
  version: 1.0.0
  summary: API REST de la plataforma de gestión de restaurantes Resttek.
  description: |
    API de Resttek: restaurantes, personal, ingredientes, platos, mesas y pedidos.

    ## Autenticación

    Las rutas protegidas exigen la cabecera `Authorization: Bearer <token>`. El token
    (JWT HS256, emisor `resttek-api`, audiencia `resttek-clients`) se obtiene con
    `POST /api/v1/auth/login` o `POST /api/v1/auth/register` y lleva en su carga
    `id`, `role` y `restaurantId`.

    Si falta el token o no es válido, el middleware `authenticate` responde **401** con
    `{ "error": "Unauthorized: ..." }` (sin `message`).

    ## Roles

    Roles: `admin`, `manager` (gerente), `camarero`, `cocinero` y `cliente`. Las rutas
    restringidas con `authorize(...)` indican los roles permitidos en la descripción y en
    la extensión `x-roles`. Un rol no permitido recibe **403** con
    `{ "error": "Forbidden: Insufficient permissions" }`.

    Algunas rutas de mesas comprueban además que el usuario pertenece al restaurante de la
    URL (`authorizeRestaurant`; el `admin` pasa siempre). Si no, **403** con
    `{ "error": "Forbidden", "message": "No tienes acceso a este restaurante" }`.

    ## Errores

    Salvo en pedidos, los errores de dominio los traduce el `errorHandler` común. El cuerpo es
    `{ "error": "<nombre de la clase>", "message": "<texto>" }` y el código HTTP se elige así:

    | Código | Errores |
    |--------|---------|
    | 404 | `EmployeeNotFoundError`, `RestaurantNotFoundError`, `IngredientNotFoundError`, `DishNotFoundError`, `TableNotFoundError` |
    | 401 | `InvalidCredentialsError` |
    | 409 | `DuplicatedTableNumberError`, `TableNotAvailableError`, `TableOccupiedError` |
    | 400 | Cualquier otro error de dominio (`AppError`), por ejemplo de validación |
    | 500 | Errores inesperados: `{ "error": "InternalServerError", "message": "Something went wrong" }` |

    Los endpoints de **pedidos** (`/api/v1/orders`) no usan el `errorHandler`: gestionan sus
    propios errores y el formato varía (se detalla en cada operación).

    ## Mantenimiento

    Este documento se mantiene a mano en `packages/api/openapi.yaml`. Cualquier endpoint
    nuevo o modificado debe reflejarse aquí; el test `src/openapi.test.ts` falla si una ruta
    montada en `app.ts` no aparece en el documento (o al revés).
servers:
  - url: /
    description: Mismo origen que sirve esta documentación (`/api/docs`)
  - url: http://localhost:3000
    description: Desarrollo local
tags:
  - name: Salud
    description: Comprobación de que la API está en marcha.
  - name: Autenticación
    description: Inicio de sesión y registro de clientes.
  - name: Empleados
    description: Gestión de usuarios (empleados, gerentes y clientes). Solo `admin`.
  - name: Restaurantes
    description: Gestión de restaurantes.
  - name: Ingredientes
    description: Inventario de ingredientes de un restaurante.
  - name: Platos
    description: Carta de platos de un restaurante.
  - name: Mesas
    description: Mesas de un restaurante y su ocupación.
  - name: Pedidos
    description: |
      Pedidos y estado de cada unidad pedida. Solo exigen autenticación (no hay `authorize`).
      Gestionan sus propios errores, sin pasar por el `errorHandler` común.
  - name: Público
    description: Rutas sin autenticación para la web de clientes.

paths:
  /health:
    get:
      tags: [Salud]
      operationId: health
      summary: Estado de la API
      security: []
      responses:
        '200':
          description: La API responde.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  # ---------------------------------------------------------------- Autenticación
  /api/v1/auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Iniciar sesión
      description: Devuelve un JWT y los datos del usuario. Sirve para cualquier rol.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@resttek.com
                password:
                  type: string
                  format: password
                  example: admin@resttek.com
      responses:
        '200':
          description: Credenciales correctas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: '`InvalidCredentialsError`: el email no existe o la contraseña no coincide.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/register:
    post:
      tags: [Autenticación]
      operationId: registerClient
      summary: Registrar un cliente
      description: Crea un usuario con rol `cliente` (sin restaurante) y devuelve su token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: Cliente registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: |
            Datos no válidos (`FirstNameRequiredError`, `LastNameRequiredError`, `InvalidEmailError`)
            o email ya registrado (`DuplicatedEmailError`, que hoy responde 400 y no 409).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Empleados
  /api/v1/employees:
    post:
      tags: [Empleados]
      operationId: createEmployee
      summary: Crear un usuario
      description: 'Roles permitidos: `admin`.'
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          description: |
            Datos no válidos (`FirstNameRequiredError`, `LastNameRequiredError`, `InvalidEmailError`,
            `InvalidRoleError`, `PasswordHashRequiredError`) o email repetido (`DuplicatedEmailError`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Empleados]
      operationId: listEmployees
      summary: Listar usuarios
      description: 'Lista paginada de usuarios, con filtro opcional por rol. Roles permitidos: `admin`.'
      x-roles: [admin]
      parameters:
        - name: limit
          in: query
          description: Número máximo de resultados (por defecto 10).
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          description: Resultados que se saltan (por defecto 0).
          schema:
            type: integer
            default: 0
        - name: role
          in: query
          description: Filtra por rol.
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/employees/{id}:
    get:
      tags: [Empleados]
      operationId: getEmployee
      summary: Obtener un usuario
      description: 'Roles permitidos: `admin`.'
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`EmployeeNotFoundError`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/employees:
    get:
      tags: [Empleados]
      operationId: listRestaurantEmployees
      summary: Listar el personal de un restaurante
      description: 'Roles permitidos: `admin`.'
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Usuarios asignados al restaurante.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Restaurantes
  /api/v1/restaurants:
    post:
      tags: [Restaurantes]
      operationId: createRestaurant
      summary: Crear un restaurante
      description: 'Roles permitidos: `admin`.'
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '201':
          description: Restaurante creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Restaurantes]
      operationId: listRestaurants
      summary: Listar restaurantes visibles para el usuario
      description: |
        Cualquier usuario autenticado. El `admin` recibe todos los restaurantes; el resto, una
        lista con su propio restaurante (o vacía si no tiene `restaurantId`).
      responses:
        '200':
          description: Lista de restaurantes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`RestaurantNotFoundError` si el restaurante del token ya no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{id}:
    get:
      tags: [Restaurantes]
      operationId: getRestaurant
      summary: Obtener un restaurante
      description: Cualquier usuario autenticado.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Restaurante encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Restaurantes]
      operationId: updateRestaurant
      summary: Actualizar un restaurante
      description: 'Sustituye todos los campos. Roles permitidos: `admin`.'
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '200':
          description: Restaurante actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Ingredientes
  /api/v1/restaurants/{restaurantId}/ingredients:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Ingredientes]
      operationId: createIngredient
      summary: Crear un ingrediente
      description: 'Roles permitidos: `admin`.'
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
      responses:
        '201':
          description: Ingrediente creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          description: '`IngredientNameRequiredError`, `InvalidUnitError`, `NegativeStockError`, `RestaurantIdRequiredError`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Ingredientes]
      operationId: listIngredients
      summary: Listar los ingredientes de un restaurante
      description: 'Roles permitidos: `admin`, `manager`, `cocinero`.'
      x-roles: [admin, manager, cocinero]
      responses:
        '200':
          description: Lista de ingredientes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/ingredients/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Ingredientes]
      operationId: getIngredient
      summary: Obtener un ingrediente
      description: |
        Roles permitidos: `admin`, `manager`, `cocinero`. Se busca solo por `id` (no se comprueba
        que pertenezca a `restaurantId`).
      x-roles: [admin, manager, cocinero]
      responses:
        '200':
          description: Ingrediente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IngredientNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Ingredientes]
      operationId: updateIngredient
      summary: Actualizar un ingrediente
      description: 'Sustituye `name`, `unit` y `currentStock`. Roles permitidos: `admin`.'
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
      responses:
        '200':
          description: Ingrediente actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IngredientNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Ingredientes]
      operationId: deleteIngredient
      summary: Eliminar un ingrediente
      description: 'Roles permitidos: `admin`.'
      x-roles: [admin]
      responses:
        '204':
          description: Ingrediente eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IngredientNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Platos
  /api/v1/restaurants/{restaurantId}/dishes:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Platos]
      operationId: createDish
      summary: Crear un plato
      description: 'Roles permitidos: `admin`, `manager`.'
      x-roles: [admin, manager]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishInput'
      responses:
        '201':
          description: Plato creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          description: '`DishNameRequiredError`, `InvalidPriceError`, `InvalidCategoryError`, `RestaurantIdRequiredError`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Platos]
      operationId: listDishes
      summary: Listar los platos de un restaurante
      description: 'Incluye los no disponibles. Roles permitidos: `admin`, `manager`, `camarero`, `cocinero`.'
      x-roles: [admin, manager, camarero, cocinero]
      responses:
        '200':
          description: Lista de platos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/dishes/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Platos]
      operationId: getDish
      summary: Obtener un plato
      description: |
        Roles permitidos: `admin`, `manager`, `camarero`, `cocinero`. Se busca solo por `id`.
      x-roles: [admin, manager, camarero, cocinero]
      responses:
        '200':
          description: Plato encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Platos]
      operationId: updateDish
      summary: Actualizar un plato
      description: |
        Sustituye todos los campos; si no se envía `ingredients`, la lista queda vacía.
        Roles permitidos: `admin`, `manager`.
      x-roles: [admin, manager]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishInput'
      responses:
        '200':
          description: Plato actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Platos]
      operationId: deleteDish
      summary: Eliminar un plato
      description: 'Roles permitidos: `admin`, `manager`.'
      x-roles: [admin, manager]
      responses:
        '204':
          description: Plato eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Mesas
  /api/v1/restaurants/{restaurantId}/tables:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Mesas]
      operationId: listTables
      summary: Listar las mesas de un restaurante
      description: |
        Roles permitidos: `admin`, `manager`, `camarero`, `cocinero`. El personal solo puede
        consultar su propio restaurante (`authorizeRestaurant`).
      x-roles: [admin, manager, camarero, cocinero]
      x-restaurant-scoped: true
      responses:
        '200':
          description: Lista de mesas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Mesas]
      operationId: createTable
      summary: Crear una mesa
      description: |
        Roles permitidos: `admin`, `manager` (del mismo restaurante). El estado por defecto es `libre`.
      x-roles: [admin, manager]
      x-restaurant-scoped: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableCreateInput'
      responses:
        '201':
          description: Mesa creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: '`TableNumberRequiredError`, `InvalidCapacityError`, `InvalidTableStatusError`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'
        '409':
          description: '`DuplicatedTableNumberError`: ya existe una mesa con ese número en el restaurante.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/tables/available:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Mesas]
      operationId: listAvailableTables
      summary: Listar mesas libres para un grupo
      description: |
        Mesas en estado `libre` con capacidad suficiente para `people` comensales.
        Roles permitidos: `cliente`.
      x-roles: [cliente]
      parameters:
        - name: people
          in: query
          required: true
          description: Número de comensales (entero >= 1).
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Mesas disponibles (vista reducida).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicTable'
        '400':
          description: '`InvalidPeopleCountError`: falta `people` o no es un entero >= 1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/tables/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Mesas]
      operationId: getTable
      summary: Obtener una mesa
      description: 'Roles permitidos: `admin`, `manager`, `camarero`, `cocinero` (del mismo restaurante).'
      x-roles: [admin, manager, camarero, cocinero]
      x-restaurant-scoped: true
      responses:
        '200':
          description: Mesa encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Mesas]
      operationId: updateTable
      summary: Actualizar una mesa
      description: 'Sustituye número, descripción, capacidad y estado. Roles permitidos: `admin`, `manager` (del mismo restaurante).'
      x-roles: [admin, manager]
      x-restaurant-scoped: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableUpdateInput'
      responses:
        '200':
          description: Mesa actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: '`TableNumberRequiredError`, `InvalidCapacityError`, `InvalidTableStatusError`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: '`DuplicatedTableNumberError`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Mesas]
      operationId: deleteTable
      summary: Eliminar una mesa
      description: 'No se puede eliminar una mesa `ocupada`. Roles permitidos: `admin`, `manager` (del mismo restaurante).'
      x-roles: [admin, manager]
      x-restaurant-scoped: true
      responses:
        '204':
          description: Mesa eliminada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: '`TableOccupiedError`: la mesa está ocupada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/tables/{id}/status:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Mesas]
      operationId: changeTableStatus
      summary: Cambiar el estado de una mesa
      description: 'Roles permitidos: `admin`, `manager`, `camarero` (del mismo restaurante).'
      x-roles: [admin, manager, camarero]
      x-restaurant-scoped: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/TableStatus'
      responses:
        '200':
          description: Mesa con el nuevo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: '`InvalidTableStatusError`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/tables/{id}/occupy:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Mesas]
      operationId: occupyTable
      summary: Ocupar una mesa
      description: |
        El cliente se sienta en una mesa: pasa de `libre` a `ocupada` de forma atómica si la
        capacidad alcanza para `people`. Roles permitidos: `cliente`.
      x-roles: [cliente]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                people:
                  type: integer
                  minimum: 1
                  description: Número de comensales.
      responses:
        '200':
          description: Mesa ocupada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: '`InvalidPeopleCountError`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: '`TableNotAvailableError`: la mesa no está libre o no tiene capacidad suficiente.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Pedidos
  /api/v1/orders:
    post:
      tags: [Pedidos]
      operationId: createOrder
      summary: Crear un pedido
      description: |
        Cualquier usuario autenticado; el `clientId` del pedido es el `id` del token.
        Cada línea se expande en tantas unidades como indique `quantity`: `quantity: 3` crea
        3 elementos con `quantity: 1`, cada uno en estado `pendiente`, para seguir su estado
        por separado. Si se indica `tableId`, la mesa debe ser del restaurante y estar `ocupada`.

        **Errores**: cualquier error responde **400** con `{ error, message }` (incluidos
        `TableNotFoundError` y `TableNotAvailableError`, que aquí no son 404/409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Pedido creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: '`RestaurantIdRequiredError`, `TableNotFoundError`, `TableNotAvailableError` u otro error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /api/v1/orders/active:
    get:
      tags: [Pedidos]
      operationId: listActiveOrders
      summary: Listar pedidos activos de un restaurante
      description: |
        Pedidos con al menos un elemento no `entregado`, del más antiguo al más reciente.
        Cualquier usuario autenticado. No incluye `restaurantName` ni `restaurantLogoUrl`.
      parameters:
        - name: restaurantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pedidos activos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Falta `restaurantId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
              example:
                error: restaurantId is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /api/v1/orders/mine:
    get:
      tags: [Pedidos]
      operationId: listMyOrders
      summary: Listar mis pedidos
      description: Pedidos cuyo `clientId` es el usuario del token, del más reciente al más antiguo.
      responses:
        '200':
          description: Pedidos del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /api/v1/orders/{id}:
    get:
      tags: [Pedidos]
      operationId: getOrder
      summary: Obtener un pedido
      description: Cualquier usuario autenticado.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido no encontrado. El cuerpo lleva el mensaje en `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
              example:
                error: Order not found
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /api/v1/orders/{orderId}/items/{itemId}/status:
    patch:
      tags: [Pedidos]
      operationId: updateOrderItemStatus
      summary: Cambiar el estado de un elemento del pedido
      description: |
        Cualquier usuario autenticado. Flujo habitual: `pendiente` → `preparando` → `listo` → `entregado`
        (la API no impone el orden).
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '204':
          description: Estado actualizado.
        '400':
          description: |
            Pedido o elemento inexistente (`OrderNotFoundError`, que aquí es 400) o estado no válido
            (`InvalidOrderStatusError`). El cuerpo lleva el mensaje en `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  # ---------------------------------------------------------------- Público
  /api/v1/public/restaurants:
    get:
      tags: [Público]
      operationId: listPublicRestaurants
      summary: Listar todos los restaurantes
      security: []
      responses:
        '200':
          description: Lista de restaurantes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/public/restaurants/{id}:
    get:
      tags: [Público]
      operationId: getPublicRestaurant
      summary: Obtener un restaurante
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Restaurante encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/public/restaurants/{restaurantId}/dishes:
    get:
      tags: [Público]
      operationId: listPublicDishes
      summary: Carta pública de un restaurante
      description: Solo los platos con `available = true`.
      security: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Platos disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
        '500':
          $ref: '#/components/responses/InternalError'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `/api/v1/auth/login` o `/api/v1/auth/register`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del recurso.
      schema:
        type: string
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Identificador (UUID) del restaurante.
      schema:
        type: string

  responses:
    ValidationError:
      description: Error de validación del dominio (`AppError` sin código específico).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Falta el token, está mal formado, ha caducado o no es válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Unauthorized: No token provided'
    Forbidden:
      description: El rol del usuario no está entre los permitidos (`authorize`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Forbidden: Insufficient permissions'
    ForbiddenRestaurant:
      description: |
        Rol no permitido (`{ "error": "Forbidden: Insufficient permissions" }`) o el usuario no
        pertenece al restaurante de la URL (`authorizeRestaurant`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden
            message: No tienes acceso a este restaurante
    RestaurantNotFound:
      description: '`RestaurantNotFoundError`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: RestaurantNotFoundError
            message: Restaurant not found
    IngredientNotFound:
      description: '`IngredientNotFoundError`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: IngredientNotFoundError
            message: Ingredient not found
    DishNotFound:
      description: '`DishNotFoundError`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: DishNotFoundError
            message: Dish not found
    TableNotFound:
      description: '`TableNotFoundError`: la mesa no existe en ese restaurante.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: TableNotFoundError
            message: Table not found
    InternalError:
      description: Error inesperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: InternalServerError
            message: Something went wrong
    OrderInternalError:
      description: Error inesperado en pedidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: Internal Server Error

  schemas:
    Error:
      type: object
      description: Cuerpo de error común que genera el `errorHandler`.
      required: [error, message]
      properties:
        error:
          type: string
          description: Nombre de la clase de error.
          example: TableNotFoundError
        message:
          type: string
          example: Table not found
    SimpleError:
      type: object
      description: Error devuelto por los middlewares de autenticación/autorización o por `OrderController`.
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string

    Role:
      type: string
      enum: [admin, manager, camarero, cocinero, cliente]
      description: Rol del usuario. `manager` es el gerente del restaurante.

    Employee:
      type: object
      description: Usuario del sistema (empleado, gerente, admin o cliente). Nunca incluye la contraseña.
      required: [id, firstName, lastName, email, role, restaurantId]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: [string, 'null']
          description: Restaurante asignado; `null` para `admin` y `cliente`.
    EmployeeInput:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: [string, 'null']
    AuthResponse:
      type: object
      required: [token, employee]
      properties:
        token:
          type: string
          description: JWT con `id`, `role` y `restaurantId`.
        employee:
          $ref: '#/components/schemas/Employee'

    Restaurant:
      type: object
      required: [id, name, address, email, phone, ownerFirstName, ownerLastName, logoUrl, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RestaurantInput:
      type: object
      description: |
        Errores de validación (400): `RestaurantNameRequiredError`, `RestaurantAddressRequiredError`,
        `OwnerFirstNameRequiredError`, `OwnerLastNameRequiredError`, `InvalidEmailError`, `InvalidPhoneError`.
      required: [name, address, email, phone, ownerFirstName, ownerLastName]
      properties:
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\+?[\d\s\-()]{7,20}$'
          example: '+34 600 000 000'
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: [string, 'null']

    IngredientUnit:
      type: string
      enum: [kg, g, l, ml, unidad]
      description: Se normaliza a minúsculas.
    Ingredient:
      type: object
      required: [id, name, unit, currentStock, restaurantId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
        restaurantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IngredientInput:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
          description: Por defecto 0 al crear; obligatorio al actualizar.

    DishCategory:
      type: string
      enum: [entrante, principal, postre, bebida]
      description: Se normaliza a minúsculas.
    DishIngredient:
      type: object
      required: [ingredientId, quantity]
      properties:
        ingredientId:
          type: string
          format: uuid
        quantity:
          type: number
          exclusiveMinimum: 0
    Dish:
      type: object
      required: [id, name, description, price, category, available, restaurantId, ingredients, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        price:
          type: number
          exclusiveMinimum: 0
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
        restaurantId:
          type: string
          format: uuid
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DishInput:
      type: object
      required: [name, price, category]
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
        price:
          type: number
          exclusiveMinimum: 0
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
          description: Por defecto `true` al crear.
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
          description: Por defecto `[]`.

    TableStatus:
      type: string
      enum: [libre, ocupada, reservada]
      description: Se normaliza a minúsculas.
    Table:
      type: object
      required: [id, restaurantId, number, description, capacity, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          description: Único dentro del restaurante.
        description:
          type: [string, 'null']
        capacity:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/TableStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicTable:
      type: object
      description: Vista reducida de una mesa para clientes.
      required: [id, number, description, capacity]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        description:
          type: [string, 'null']
        capacity:
          type: integer
    TableCreateInput:
      type: object
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
        description:
          type: [string, 'null']
          description: Una cadena vacía se guarda como `null`.
        capacity:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/TableStatus'
    TableUpdateInput:
      type: object
      required: [number, capacity, status]
      properties:
        number:
          type: integer
          minimum: 1
        description:
          type: [string, 'null']
        capacity:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/TableStatus'

    OrderStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
      description: Estado de cada unidad pedida. Se normaliza a minúsculas.
    OrderItem:
      type: object
      required: [id, dishId, quantity, notes, status]
      properties:
        id:
          type: string
          format: uuid
        dishId:
          type: string
          format: uuid
        quantity:
          type: integer
          const: 1
          description: Siempre 1; las cantidades se expanden en varios elementos.
        notes:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/OrderStatus'
        dishName:
          type: [string, 'null']
          description: Solo al leer pedidos (no en la respuesta de creación).
        dishPrice:
          type: [number, 'null']
          description: Solo al leer pedidos.
        dishCategory:
          type: [string, 'null']
          description: Solo al leer pedidos.
    Order:
      type: object
      required: [id, restaurantId, tableId, clientId, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        tableId:
          type: [string, 'null']
        tableNumber:
          type: [integer, 'null']
          description: Número de la mesa, si la hay.
        clientId:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        restaurantName:
          type: string
          description: Solo en `GET /orders/{id}` y `GET /orders/mine`.
        restaurantLogoUrl:
          type: [string, 'null']
          description: Solo en `GET /orders/{id}` y `GET /orders/mine`.
    OrderInput:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
          format: uuid
        tableId:
          type: [string, 'null']
          description: Mesa ocupada del restaurante; `null` u omitido si no hay mesa.
        items:
          type: array
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
